<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>創作用食べ物ジェネレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 配色と書体は yatai.html / sakaba.html と揃える */
:root{
  --paper:#e6ebe9;
  --surface:#f5f7f6;
  --ink:#18262f;
  --muted:#586870;
  --line:#c2ccc9;
  --tag:#1f3357;
  --tag-ink:#f1f3ee;
  --tag-sub:#b9c6dc;
  --accent:#d99a00;
  --display:"Yuji Syuku","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f151c; --surface:#172029; --ink:#e5eaec; --muted:#93a2aa; --line:#2c3944;
    --tag:#253d6b; --tag-ink:#f3f4ef; --tag-sub:#b4c3de; --accent:#eeb11f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f151c; --surface:#172029; --ink:#e5eaec; --muted:#93a2aa; --line:#2c3944;
  --tag:#253d6b; --tag-ink:#f3f4ef; --tag-sub:#b4c3de; --accent:#eeb11f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:28px 20px 64px;display:flex;flex-direction:column;gap:28px}
h1,h2{margin:0;text-wrap:balance;font-family:var(--display);font-weight:400;letter-spacing:.04em}
h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.15}
h2{font-size:1.5rem;line-height:1.3}
p{margin:0}
.lead{max-width:36em;color:var(--muted);margin-top:8px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.shops{list-style:none;margin:0;padding:14px 0 0;border-top:6px solid var(--ink);display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.shop{display:flex;gap:16px;height:100%;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:6px;color:inherit;text-decoration:none}
.shop:hover{border-color:var(--ink)}
.shop:hover .enter{border-bottom-color:var(--accent)}
.sign{flex:none;writing-mode:vertical-rl;display:flex;align-items:center;justify-content:center;min-height:9.5rem;padding:1rem .55rem;background:var(--tag);color:var(--tag-ink);border-radius:3px;font-family:var(--display);font-size:1.7rem;letter-spacing:.2em;line-height:1;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.about{display:flex;flex-direction:column;gap:6px;min-width:0}
.kind{font-size:.82rem;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.desc{font-size:.92rem;color:var(--muted)}
.enter{margin-top:auto;padding-top:8px;align-self:flex-start;font-weight:700;border-bottom:2px solid transparent}
@media (max-width:620px){
  .shops{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>創作用食べ物ジェネレーター</h1>
    <p class="lead">造語を使わず、ふつうの言葉の組み合わせで、異世界の町の食べ物と飲み物に名前をつけます。店を選んでください。</p>
  </header>

  <nav aria-label="ジェネレーター一覧">
    <ul class="shops">
      <li>
        <a class="shop" href="yatai.html">
          <span class="sign" aria-hidden="true">屋台</span>
          <div class="about">
            <span class="kind">食べ物</span>
            <h2>異世界屋台の品書き</h2>
            <span class="desc">調理法・素材・形を組み合わせて、町の食べ物に名前をつけます。</span>
            <span class="enter">屋台へ →</span>
          </div>
        </a>
      </li>
      <li>
        <a class="shop" href="sakaba.html">
          <span class="sign" aria-hidden="true">酒場</span>
          <div class="about">
            <span class="kind">飲み物</span>
            <h2>異世界酒場の品書き</h2>
            <span class="desc">種類・素材・飲み方を組み合わせて、町の飲み物に名前をつけます。酒も、酒でないものも作れます。</span>
            <span class="enter">酒場へ →</span>
          </div>
        </a>
      </li>
    </ul>
  </nav>
</div>
</body>
</html>
